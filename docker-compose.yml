version: '3.8'

services:
  nexuscore-api:
    build: .
    container_name: nexuscore-state-engine
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    command: python app.py

  nexuscore-web:
    image: nginx:latest
    container_name: nexuscore-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nexuscore-api

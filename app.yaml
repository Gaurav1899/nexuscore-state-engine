apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexuscore-chat
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '100'
    spec:
      serviceAccountName: default
      containers:
        - image: gcr.io/PROJECT_ID/nexuscore-chat:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: '1'
              memory: '512Mi'
            limits:
              cpu: '2'
              memory: '1Gi'
          env:
            - name: ENVIRONMENT
              value: 'production'
            - name: LOG_LEVEL
              value: 'INFO'
            - name: WORKERS
              value: '4'
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/state
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      timeoutSeconds: 3600